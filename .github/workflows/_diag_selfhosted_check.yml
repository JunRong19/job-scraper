name: Diagnostic Self-Hosted IP Check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted

    steps:
      - name: Check outbound access from self-hosted runner
        shell: pwsh
        run: |
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          $headers = @{ "User-Agent" = $ua }

          Write-Host "=== jobs.careers.gov.sg ==="
          $cg = Invoke-WebRequest -Uri "https://jobs.careers.gov.sg/" -Headers $headers -SkipHttpErrorCheck
          Write-Host "status=$($cg.StatusCode) size=$($cg.RawContentLength)"
          if ($cg.Content -match '<title>([^<]*)</title>') { Write-Host $matches[1] }

          Write-Host "=== jobstreet ==="
          $js = Invoke-WebRequest -Uri "https://sg.jobstreet.com/jobs?keywords=software%20engineer" -Headers $headers -SkipHttpErrorCheck
          Write-Host "status=$($js.StatusCode) size=$($js.RawContentLength)"
          Write-Host "SEEK_REDUX_DATA present: $($js.Content -match 'SEEK_REDUX_DATA')"
