name: Diagnostic Self-Hosted IP Check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted

    steps:
      - name: Check outbound access from self-hosted runner
        shell: powershell
        run: |
          $ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          $headers = @{ "User-Agent" = $ua }

          function Check-Url($label, $url) {
            Write-Host "=== $label ==="
            try {
              $resp = Invoke-WebRequest -Uri $url -Headers $headers -UseBasicParsing
              Write-Host "status=$($resp.StatusCode) size=$($resp.RawContentLength)"
              if ($resp.Content -match '<title>([^<]*)</title>') { Write-Host $matches[1] }
              return $resp
            } catch {
              $statusCode = $_.Exception.Response.StatusCode.value__
              Write-Host "status=$statusCode (exception: $($_.Exception.Message))"
              return $null
            }
          }

          Check-Url "jobs.careers.gov.sg" "https://jobs.careers.gov.sg/" | Out-Null
          $js = Check-Url "jobstreet" "https://sg.jobstreet.com/jobs?keywords=software%20engineer"
          if ($js) { Write-Host "SEEK_REDUX_DATA present: $($js.Content -match 'SEEK_REDUX_DATA')" }
