name: Self-Hosted Job Scraper (Careers@Gov + JobStreet)

on:
  workflow_dispatch: # Manual trigger only — JobStreet and Careers@Gov block GitHub-hosted runner IPs, so this must run on a self-hosted runner.

jobs:
  scrape:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run self-hosted scraper script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python selfhosted_scraper.py
